#dataset: Tiny-Imagenet
epochs: 300
STHOS: 75
time_step: 4
dim: 384
num_heads: 12
patch_size: 14
mlp_ratio: 4
depths: 4
data_dir: /home/think/Downloads/tiny_imagenet_200/
dataset: imagenet
num_classes: 200
img_size: 224
mean:
    - 0.485
    - 0.456
    - 0.406
std:
    - 0.229
    - 0.224
    - 0.225
crop_pct: 1.0
scale:
    - 1.0
    - 1.0

interpolation: bicubic
train_interpolation: bicubic
aa: rand-m7-mstd0.5-inc1
mixup: 0.8
