dataset: imagenet
num_classes: 1000
img_size: 224
dim: 384
patch_size: 14
num_heads: 12
mlp_ratio: 4
STHOS: 0
data_dir: /home/think/imagenet2012/

mean:
    - 0.485
    - 0.456
    - 0.406
std:
    - 0.229
    - 0.224
    - 0.225
crop_pct: 1.0
scale:
    - 1.0
    - 1.0

interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-mstd0.5-inc1
mixup: 0.5
mixup_off_epoch: 310
mixup_prob: 0.6
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0.5
reprob: 0.25
remode: const
amp: True
batch_size: 32
val_batch_size: 32
lr: 1e-3
min_lr: 0.00001
sched: cosine
weight_decay: 1e-2
epochs: 300
cooldown_epochs: 10
warmup_epochs: 10
warmup_lr: 0.00001
opt: lamb
smoothing: 0.1
workers: 8
depths: 8
